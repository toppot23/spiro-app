<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spirometry App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SpiroApp">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col p-4">

    <div class="max-w-lg w-full bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 flex-1 flex flex-col relative mx-auto my-auto h-full justify-center">
        
        <div class="text-center mb-8">
            <div class="inline-block bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-medium mb-3">Spirometry PWA</div>
            <h1 class="text-2xl font-semibold text-slate-800">การแปลผลสมรรถภาพปอด</h1>
        </div>

        <div id="progress-container" class="w-full bg-slate-100 rounded-full h-1.5 mb-8">
            <div id="progress-bar" class="bg-blue-300 h-1.5 rounded-full transition-all duration-300" style="width: 25%"></div>
        </div>

        <div id="app-content" class="min-h-[250px] flex flex-col justify-center">
            </div>

        <div id="restart-container" class="mt-12 text-center hidden pb-4">
            <button onclick="initApp()" class="text-sm text-slate-500 hover:text-blue-600 transition-colors underline decoration-slate-300 underline-offset-4 font-medium px-4 py-2">
                🔄 เริ่มประเมินใหม่
            </button>
        </div>
    </div>

    <script>
        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker Registered!', reg);
                }).catch(err => {
                    console.log('Service Worker Failed', err);
                });
            });
        }

        // --- App Logic (เหมือนเดิม) ---
        let currentStep = 0; let diagnosticData = {};
        const contentDiv = document.getElementById('app-content');
        const progressBar = document.getElementById('progress-bar');
        const restartContainer = document.getElementById('restart-container');

        function initApp() { currentStep = 1; diagnosticData = {}; restartContainer.classList.add('hidden'); renderStep1(); }
        function updateProgress(percent) { progressBar.style.width = percent + '%'; }

        function renderStep1() {
            updateProgress(25);
            contentDiv.innerHTML = `
                <div class="fade-in"><h2 class="text-lg font-medium text-center mb-6">1. ค่า <span class="font-semibold text-blue-600">FEV1 / FVC</span> เป็นอย่างไร?</h2>
                    <div class="space-y-3">
                        <button onclick="handleStep1('obstructive')" class="w-full bg-rose-50 hover:bg-rose-100 active:bg-rose-200 text-rose-700 border border-rose-100 rounded-2xl p-4 transition-colors text-left flex justify-between items-center shadow-sm">
                            <span>น้อยกว่า 70% (หรือ &lt; LLN)</span><span class="text-xl">👉</span>
                        </button>
                        <button onclick="handleStep1('normal')" class="w-full bg-teal-50 hover:bg-teal-100 active:bg-teal-200 text-teal-700 border border-teal-100 rounded-2xl p-4 transition-colors text-left flex justify-between items-center shadow-sm">
                            <span>มากกว่า หรือ เท่ากับ 70%</span><span class="text-xl">👉</span>
                        </button>
                    </div></div>`;
        }

        function handleStep1(result) { diagnosticData.type = result; renderStep2(); }

        function renderStep2() {
            updateProgress(50);
            contentDiv.innerHTML = `
                <div class="fade-in"><h2 class="text-lg font-medium text-center mb-6">2. ค่า <span class="font-semibold text-blue-600">FVC</span> เป็นอย่างไร?</h2>
                    <div class="space-y-3">
                        <button onclick="handleStep2('high')" class="w-full bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border border-slate-200 rounded-2xl p-4 transition-colors text-left shadow-sm">
                            <span class="font-medium">≥ 80%</span> ของค่าพยากรณ์
                        </button>
                        <button onclick="handleStep2('low')" class="w-full bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border border-slate-200 rounded-2xl p-4 transition-colors text-left shadow-sm">
                            <span class="font-medium">&lt; 80%</span> ของค่าพยากรณ์
                        </button>
                    </div></div>`;
        }

        function handleStep2(fvcResult) {
            diagnosticData.fvc = fvcResult;
            if (diagnosticData.type === 'normal') showFinalResult(); else renderStep3();
        }

        function renderStep3() {
            updateProgress(75);
            contentDiv.innerHTML = `
                <div class="fade-in"><h2 class="text-lg font-medium text-center mb-2">3. ประเมินความรุนแรง</h2>
                    <p class="text-sm text-slate-500 text-center mb-6">ค่า <span class="font-semibold">FEV1 (% Predicted)</span> อยู่ในช่วงใด?</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="handleStep3('Mild')" class="bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-700 border border-slate-200 rounded-2xl p-4 transition-colors shadow-sm">≥ 80%<br><span class="text-xs text-slate-500">Mild</span></button>
                        <button onclick="handleStep3('Moderate')" class="bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-700 border border-slate-200 rounded-2xl p-4 transition-colors shadow-sm">50 - 79%<br><span class="text-xs text-slate-500">Moderate</span></button>
                        <button onclick="handleStep3('Severe')" class="bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-700 border border-slate-200 rounded-2xl p-4 transition-colors shadow-sm">30 - 49%<br><span class="text-xs text-slate-500">Severe</span></button>
                        <button onclick="handleStep3('Very Severe')" class="bg-white hover:bg-blue-50 active:bg-blue-100 text-slate-700 border border-slate-200 rounded-2xl p-4 transition-colors shadow-sm">&lt; 30%<br><span class="text-xs text-slate-500">Very Severe</span></button>
                    </div></div>`;
        }

        function handleStep3(severity) { diagnosticData.severity = severity; renderStep4(); }

        function renderStep4() {
            updateProgress(90);
            contentDiv.innerHTML = `
                <div class="fade-in"><h2 class="text-lg font-medium text-center mb-2">4. การตอบสนองต่อยา</h2>
                    <p class="text-sm text-slate-500 text-center mb-6">หลังพ่นยา ค่า FEV1/FVC เพิ่มขึ้น <span class="font-semibold text-blue-600">≥ 12% และ ≥ 200 ml</span> หรือไม่?</p>
                    <div class="space-y-3">
                        <button onclick="handleStep4('Positive')" class="w-full bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 border border-indigo-100 rounded-2xl p-4 transition-colors shadow-sm">ใช่ (Positive Reversibility)</button>
                        <button onclick="handleStep4('Negative')" class="w-full bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-600 border border-slate-200 rounded-2xl p-4 transition-colors shadow-sm">ไม่ใช่ (Negative Reversibility)</button>
                    </div></div>`;
        }

        function showFinalResult() {
            updateProgress(100); restartContainer.classList.remove('hidden');
            let resTitle = "", resDesc = "", cClass = "", bg = "";

            if (diagnosticData.type === 'normal') {
                if (diagnosticData.fvc === 'high') { resTitle = "Normal Spirometry"; resDesc = "ผลการตรวจปกติ ✨"; cClass = "text-teal-600"; bg = "bg-teal-50 border-teal-100"; } 
                else { resTitle = "Restrictive Defect"; resDesc = "สงสัยภาวะปอดขยายตัวจำกัด ⚠️<br><span class='text-sm mt-2 block text-slate-500'>*แนะนำส่งตรวจ Lung Volume เพิ่มเติม</span>"; cClass = "text-purple-600"; bg = "bg-purple-50 border-purple-100"; }
            } else {
                let dType = (diagnosticData.fvc === 'high') ? "Obstructive Defect" : "Mixed Defect";
                let rText = (diagnosticData.reversibility === 'Positive') ? "Positive (นึกถึง Asthma)" : "Negative (นึกถึง COPD)";
                resTitle = dType;
                resDesc = `<div class="text-left mt-2 space-y-2 text-sm text-slate-600"><p><b>ความรุนแรง:</b> ${diagnosticData.severity}</p><p><b>การตอบสนองต่อยา:</b> ${rText}</p>${diagnosticData.fvc === 'low' ? "<p class='text-xs text-orange-500 mt-2'>*Mixed: มีภาวะอุดกั้นร่วมกับจำกัดการขยายตัว</p>" : ""}</div>`;
                cClass = "text-rose-600"; bg = "bg-rose-50 border-rose-100";
            }

            contentDiv.innerHTML = `<div class="fade-in text-center"><p class="text-sm text-slate-400 mb-2">ผลการประเมิน</p><div class="p-6 rounded-2xl border ${bg} shadow-sm"><h2 class="text-2xl font-semibold mb-3 ${cClass}">${resTitle}</h2><div class="text-slate-700">${resDesc}</div></div></div>`;
        }

        window.onload = initApp;
    </script>
</body>
</html>
